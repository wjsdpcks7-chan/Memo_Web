<!DOCTYPE html>
<html>
    <head>
        <meta charset = "utf-8">
        <title>
            메모 리스트 페이지
        </title>
    </head>
    <body>
        <h1>메모 리스트 페이지</h1><br>
        <a href = "/">메모 작성</a><br>
        <p id="MemoContent"></p>
        <ul id="MemoList"></ul>


        <script>
            const memoList = document.getElementById("MemoList")
            const memoContent = document.getElementById("MemoContent")

            async function loadList() {
                const response = await fetch("/memos");
                
                const data = await response.json()

                for (const memoId of data) {
                    const item = document.createElement("li")
                    item.textContent = `${memoId}번 메모`
                    item.addEventListener("click", async () =>{
                        loadContent(memoId);
                    });
                    memoList.appendChild(item)
                }
            }
            async function loadContent(memoId){
                const response = await fetch(`/memos/${memoId}`);
                const data = await response.json()
                memoContent.textContent = data.content
            }
            loadList();


        </script>
    </body>
</html>
